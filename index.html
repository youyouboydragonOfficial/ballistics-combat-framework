<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modular Combat, Aim & Ballistics Framework</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0e14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    #blocker {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(10, 14, 20, 0.7);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      z-index: 999;
      cursor: pointer;
    }
    #instructions {
      text-align: center;
      background: rgba(20, 26, 36, 0.85);
      border: 1px solid rgba(0, 255, 200, 0.3);
      padding: 30px 50px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
    }
    h1 {
      font-size: 26px;
      color: #00ffcc;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    p {
      color: #ccc;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .click-prompt {
      margin-top: 18px;
      font-size: 16px;
      font-weight: bold;
      color: #ffaa00;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, -150%) scale(0.9); }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="blocker">
    <div id="instructions">
      <h1>汎用弾道・戦闘・エイムシステム</h1>
      <p>Modular Combat & Ballistics Framework (TPS / FPS)</p>
      <div style="height: 1px; background: rgba(255,255,255,0.15); margin: 15px 0;"></div>
      <p>フォートナイト/荒野行動（TPS弾道）＆ デルタフォース（ミリタリー弾道）両対応</p>
      <p>リアルタイム物理弾道 (CCD) / ヒットスキャン / 偏差射撃・迎角自動補正</p>
      <div class="click-prompt">画面をクリックして操作開始 (Pointer Lock)</div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
